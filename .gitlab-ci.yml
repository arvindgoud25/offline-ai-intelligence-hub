stages:
  - lint
  - test
  - security

image: python:3.13

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -r requirements-dev.txt

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
    - pre-commit run --all-files

test:
  stage: test
  script:
    - pytest
    - coverage run -m pytest
    - coverage report

security:
  stage: security
  script:
    - pip-audit
